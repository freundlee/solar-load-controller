name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-deploy:
    # Run directly on the runner host so docker CLI can reach the daemon
    runs-on: node2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure environment
        id: env
        # Use env var to avoid shell-injection from github.ref_name
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            SERVICE="solar-dashboard"
            IMAGE="solar-dashboard"
          else
            SERVICE="solar-dashboard-${REF_NAME}"
            IMAGE="solar-dashboard-${REF_NAME}"
          fi
          echo "SERVICE_NAME=$SERVICE" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=10.10.0.3:5000/$IMAGE:${RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ steps.env.outputs.IMAGE_TAG }} .

      - name: Push to registry
        run: docker push ${{ steps.env.outputs.IMAGE_TAG }}

      - name: Deploy swarm service
        env:
          IMAGE_TAG: ${{ steps.env.outputs.IMAGE_TAG }}
          SERVICE_NAME: ${{ steps.env.outputs.SERVICE_NAME }}
          ANKER_EMAIL: ${{ secrets.ANKER_EMAIL }}
          ANKER_PASSWORD: ${{ secrets.ANKER_PASSWORD }}
          ANKER_COUNTRY: ${{ secrets.ANKER_COUNTRY }}
          IOMETER_HOST: ${{ secrets.IOMETER_HOST }}
          ESP32_API_KEY: ${{ secrets.ESP32_API_KEY }}
          IOMETER_PUSH_KEY: ${{ secrets.IOMETER_PUSH_KEY }}
          TZ: ${{ secrets.TZ }}
        run: |
          if docker service inspect "$SERVICE_NAME" > /dev/null 2>&1; then
            # Service exists — update it
            docker service update \
              --image "$IMAGE_TAG" \
              --env-add TZ="${TZ:-Europe/Berlin}" \
              --env-add ANKER_EMAIL="$ANKER_EMAIL" \
              --env-add ANKER_PASSWORD="$ANKER_PASSWORD" \
              --env-add ANKER_COUNTRY="${ANKER_COUNTRY:-DE}" \
              --env-add IOMETER_HOST="${IOMETER_HOST:-192.168.178.96}" \
              --env-add ESP32_API_KEY="$ESP32_API_KEY" \
              --env-add IOMETER_PUSH_KEY="$IOMETER_PUSH_KEY" \
              --with-registry-auth \
              "$SERVICE_NAME"
          else
            # First deployment — create the service
            docker service create \
              --name "$SERVICE_NAME" \
              --publish 8000:8000 \
              --mount type=volume,source=solar-data,target=/app/data \
              --env TZ="${TZ:-Europe/Berlin}" \
              --env ANKER_EMAIL="$ANKER_EMAIL" \
              --env ANKER_PASSWORD="$ANKER_PASSWORD" \
              --env ANKER_COUNTRY="${ANKER_COUNTRY:-DE}" \
              --env IOMETER_HOST="${IOMETER_HOST:-192.168.178.96}" \
              --env ESP32_API_KEY="$ESP32_API_KEY" \
              --env IOMETER_PUSH_KEY="$IOMETER_PUSH_KEY" \
              --with-registry-auth \
              "$IMAGE_TAG"
          fi