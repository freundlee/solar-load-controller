name: Build and Deploy
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: node2
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 10.10.0.3:5000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      
      - name: Build image
        run: docker build -t 10.10.0.3:5000/solar-dashboard:${{ github.run_number }} .
      
      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 10.10.0.3:5000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Push to registry
        run: docker push 10.10.0.3:5000/solar-dashboard:${{ github.run_number }}
      
      - name: Deploy or update service
        run: |
          if docker service ls --format '{{.Name}}' | grep -q '^solar-dashboard$'; then
            docker service update --image 10.10.0.3:5000/solar-dashboard:${{ github.run_number }} --with-registry-auth solar-dashboard
          else
            docker service create --name solar-dashboard --replicas 1 --publish 8888:3000 --with-registry-auth 10.10.0.3:5000/solar-dashboard:${{ github.run_number }}
          fi