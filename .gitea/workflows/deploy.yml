name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev          # 加新分支
      # - staging    # 后续要加新环境，就在这里追加

jobs:
  build-deploy:
    runs-on: node2
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVICE="<app>"
            IMAGE="<app>"
          else
            SERVICE="<app>-${{ github.ref_name }}"
            IMAGE="<app>-${{ github.ref_name }}"
          fi
          echo "SERVICE_NAME=$SERVICE" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=10.10.0.3:5000/$IMAGE:${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ steps.env.outputs.IMAGE_TAG }} .

      - name: Push to registry
        run: docker push ${{ steps.env.outputs.IMAGE_TAG }}

      - name: Update swarm service
        run: |
          docker service update \
            --image ${{ steps.env.outputs.IMAGE_TAG }} \
            --env-add ANKER_EMAIL="${{ secrets.ANKER_EMAIL }}" \
            --env-add ANKER_PASSWORD="${{ secrets.ANKER_PASSWORD }}" \
            --with-registry-auth \
            ${{ steps.env.outputs.SERVICE_NAME }}