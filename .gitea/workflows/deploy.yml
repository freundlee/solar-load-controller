name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-deploy:
    runs-on: node2
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            STACK_NAME="solar-load-controller"
            DOMAIN="solar-load.duoa.de"
            APP_ENV="production"
            TRAEFIK_MIDDLEWARES=""
          else
            STACK_NAME="solar-load-controller-dev"
            DOMAIN="solar-load-dev.duoa.de"
            APP_ENV="dev"
            TRAEFIK_MIDDLEWARES="internal-auth@swarm"
          fi
          {
            echo "STACK_NAME=$STACK_NAME"
            echo "DOMAIN=$DOMAIN"
            echo "APP_ENV=$APP_ENV"
            echo "TRAEFIK_MIDDLEWARES=$TRAEFIK_MIDDLEWARES"
            echo "DATA_DIR=/data/docker/volumes/$STACK_NAME"
            echo "IMAGE_TAG=10.10.0.3:5000/$STACK_NAME:${{ github.run_number }}"
          } >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          docker build -t ${{ steps.env.outputs.IMAGE_TAG }} .
          docker push ${{ steps.env.outputs.IMAGE_TAG }}

      - name: Prepare data directory on node2
        run: |
          docker run --rm -v /data/docker/volumes:/v alpine \
            sh -c "mkdir -p /v/${{ steps.env.outputs.STACK_NAME }} && chown -R 1000:1000 /v/${{ steps.env.outputs.STACK_NAME }}"

      - name: Deploy stack
        env:
          IMAGE_TAG: ${{ steps.env.outputs.IMAGE_TAG }}
          STACK_NAME: ${{ steps.env.outputs.STACK_NAME }}
          DOMAIN: ${{ steps.env.outputs.DOMAIN }}
          APP_ENV: ${{ steps.env.outputs.APP_ENV }}
          DATA_DIR: ${{ steps.env.outputs.DATA_DIR }}
          TRAEFIK_MIDDLEWARES: ${{ steps.env.outputs.TRAEFIK_MIDDLEWARES }}
          ANKER_EMAIL: ${{ secrets.ANKER_EMAIL }}
          ANKER_PASSWORD: ${{ secrets.ANKER_PASSWORD }}
        run: |
          # main 分支无 middleware -> 删该行避免 Traefik 解析空值
          if [ -z "$TRAEFIK_MIDDLEWARES" ]; then
            grep -v 'routers\..*\.middlewares=' stack.yml > stack.deploy.yml
          else
            cp stack.yml stack.deploy.yml
          fi
          docker stack deploy \
            -c stack.deploy.yml \
            --with-registry-auth \
            "$STACK_NAME"

      - name: Verify deployment
        run: |
          sleep 5
          docker service ls --filter "name=${{ steps.env.outputs.STACK_NAME }}_app"
          docker service ps "${{ steps.env.outputs.STACK_NAME }}_app" --no-trunc | head -5
