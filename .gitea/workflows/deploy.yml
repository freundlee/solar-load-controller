name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: node2
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=10.10.0.3:5000/solar-dashboard:${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ${{ steps.tag.outputs.IMAGE_TAG }} .

      - name: Push to registry
        run: docker push ${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Update swarm service
        run: |
          docker service update \
            --image ${{ steps.tag.outputs.IMAGE_TAG }} \
            --env-add ANKER_USERNAME="${{ secrets.ANKER_USERNAME }}" \
            --env-add ANKER_PASSWORD="${{ secrets.ANKER_PASSWORD }}" \
            --with-registry-auth \
            solar-dashboard
