version: '3.8'

services:
  solar-dashboard:
    build: .
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - ANKER_EMAIL=${ANKER_EMAIL}
      - ANKER_PASSWORD=${ANKER_PASSWORD}
      - ANKER_COUNTRY=${ANKER_COUNTRY:-DE}
      - IOMETER_HOST=${IOMETER_HOST:-192.168.178.96}
      - ESP32_API_KEY=${ESP32_API_KEY:-change_me_strong_secret}
      - IOMETER_PUSH_KEY=${IOMETER_PUSH_KEY:-change_me_strong_secret}
    ports:
      - "8000:8000"
    volumes:
      - solar-data:/app/data
    network_mode: host
    restart: unless-stopped

volumes:
  solar-data: