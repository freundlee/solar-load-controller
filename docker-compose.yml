services:
  solar-controller:
    build: .
    container_name: solar-load-controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - ANKER_EMAIL=${ANKER_EMAIL}
      - ANKER_PASSWORD=${ANKER_PASSWORD}
      - ANKER_COUNTRY=${ANKER_COUNTRY:-DE}
      - IOMETER_HOST=${IOMETER_HOST:-192.168.178.96}
    volumes:
      - solar-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  solar-data:
    driver: local
