services:
  solar-controller:
    build: .
    container_name: solar-load-controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - ANKER_EMAIL=${ANKER_EMAIL}
      - ANKER_PASSWORD=${ANKER_PASSWORD}
      - ANKER_COUNTRY=${ANKER_COUNTRY:-DE}
      - IOMETER_HOST=${IOMETER_HOST:-192.168.178.96}
    volumes:
      - solar-data:/app/data
    # Required for accessing local network devices (IOMeter)
    network_mode: host
    # If you prefer bridge mode + explicit ports, comment out network_mode
    # and uncomment the ports mapping above, but ensure IOMeter is reachable.

volumes:
  solar-data:
    driver: local
