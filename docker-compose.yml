version: '3.8'

services:
  solar-dashboard:
    build: .
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - ANKER_EMAIL=${ANKER_EMAIL}
      - ANKER_PASSWORD=${ANKER_PASSWORD}
      - ANKER_COUNTRY=${ANKER_COUNTRY:-DE}
      - IOMETER_HOST=${IOMETER_HOST:-192.168.178.96}
    ports:
      - "8000:8000"
    volumes:
      - solar-data:/app/data
    network_mode: host
    restart: unless-stopped

volumes:
  solar-data:
    driver: local
